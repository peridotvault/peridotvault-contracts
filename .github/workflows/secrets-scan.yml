name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (OSS binary, no license needed)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Scope the scan to the PR/push delta. A full-history scan is
      # expected to flag pre-untrack revisions until the board-owned
      # history purge lands (ANT-885); scoping keeps this check green
      # for leak-free changes without weakening the guard on new content.
      - name: Gitleaks scan (delta vs paperclip base)
        run: |
          set -euo pipefail
          git fetch origin paperclip:refs/remotes/origin/paperclip || true
          BASE="$(git merge-base HEAD origin/paperclip 2>/dev/null || echo 'HEAD~1')"
          echo "Scanning range: $BASE..HEAD"
          gitleaks detect --source . --config .gitleaks.toml --verbose --log-opts="$BASE..HEAD"
